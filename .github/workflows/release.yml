name: Release

# Builds Windows (x64) and Android (arm64) on every push to master and
# publishes them as a GitHub release on https://github.com/tib-kpl/OpenJKDF2/releases.
# Each commit gets its own release, tagged build-<commit count>.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  win64:
    runs-on: ubuntu-24.04
    env:
      OPENJKDF2_BUILD_DIR: build_win64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
        name: Checkout
      - name: Install Packages
        run: |
          sudo apt-get update -qq &&
          sudo apt-get install \
                       -y --no-install-suggests --no-install-recommends \
                       build-essential devscripts cmake make python3 python3-pip imagemagick zip &&
          sudo apt-get install -y zsh mingw-w64 clang libopenal-dev libglew-dev &&
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix &&
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix &&
          sudo pip3 install cogapp
      - name: Generate CMake Build System
        run: |
          export OPENJKDF2_RELEASE_COMMIT="$(git log -1 --format=%H)" \
                 OPENJKDF2_RELEASE_COMMIT_SHORT="$(git rev-parse --short=8 HEAD)"
          cmake --toolchain cmake_modules/toolchain_mingw.cmake \
                -DCMAKE_BUILD_TYPE=Release -DGITHUB_RUNNER_COMPILE=1 \
                -B "$OPENJKDF2_BUILD_DIR"
      - name: Make
        run: make -C "$OPENJKDF2_BUILD_DIR" -j $(nproc)
      - name: Package
        run: |
          ./scripts/helper_CopyMinGWDLLs.sh
          mkdir -p win64-package
          cp build_win64/*.dll build_win64/*.exe win64-package/
          (cd win64-package && zip -r ../OpenJKDF2-win64.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: win64
          path: OpenJKDF2-win64.zip

  android:
    runs-on: ubuntu-24.04
    env:
      OPENJKDF2_BUILD_DIR: build_android_aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # versionCode is the commit count
        name: Checkout
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Packages
        run: |
          sudo apt-get update -qq &&
          sudo apt-get install -y --no-install-suggests --no-install-recommends \
                       build-essential cmake make python3 python3-pip bison imagemagick &&
          sudo pip3 install cogapp
      - name: Generate CMake Build System
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export OPENJKDF2_RELEASE_COMMIT="$(git log -1 --format=%H)" \
                 OPENJKDF2_RELEASE_COMMIT_SHORT="$(git rev-parse --short=8 HEAD)"
          cmake --toolchain cmake_modules/toolchain_android_aarch64.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -B "$OPENJKDF2_BUILD_DIR"
      - name: Make
        run: make -C "$OPENJKDF2_BUILD_DIR" -j $(nproc) openjkdf2-armv8a || make -C "$OPENJKDF2_BUILD_DIR" -j1 openjkdf2-armv8a
      - name: Gradle
        env:
          OPENJKDF2_KEYSTORE_B64: ${{ secrets.OPENJKDF2_KEYSTORE_B64 }}
          OPENJKDF2_KEYSTORE_PASSWORD: ${{ secrets.OPENJKDF2_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$OPENJKDF2_KEYSTORE_B64" ]; then
            echo "::error::Secret OPENJKDF2_KEYSTORE_B64 is missing, refusing to publish an APK signed with a throwaway key"
            exit 1
          fi
          export OPENJKDF2_KEYSTORE_FILE="$RUNNER_TEMP/openjkdf2-release.jks"
          echo "$OPENJKDF2_KEYSTORE_B64" | base64 -d > "$OPENJKDF2_KEYSTORE_FILE"
          LIBS=packaging/android-project/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$LIBS"
          cp "$OPENJKDF2_BUILD_DIR/libopenjkdf2-armv8a.so" "$LIBS/libmain.so"
          cp "$(find "$OPENJKDF2_BUILD_DIR" -name libopenal.so | head -1)" "$LIBS/"
          cp "$(find "$OPENJKDF2_BUILD_DIR" -name libSDL3.so | head -1)" "$LIBS/"
          cp "$(find "$OPENJKDF2_BUILD_DIR" -name libSDL3_mixer.so | head -1)" "$LIBS/"
          cd packaging/android-project
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/OpenJKDF2-android-arm64-v8a.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: OpenJKDF2-android-arm64-v8a.apk

  publish:
    needs: [win64, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Compute tag
        id: tag
        run: |
          echo "tag=build-$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.tag }} (${{ steps.tag.outputs.short }})
          make_latest: true
          generate_release_notes: true
          files: |
            dist/OpenJKDF2-win64.zip
            dist/OpenJKDF2-android-arm64-v8a.apk
