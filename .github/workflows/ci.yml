name: CI

# One pipeline per commit: the platform builds run as parallel jobs. On master,
# each job adds its package (Linux, macOS, Windows, signed Android APK) to the
# build-<run number> release on https://github.com/tib-kpl/OpenJKDF2/releases
# as soon as it is done, so a slow or failing platform never holds back the
# others.

on:
  push:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  # Keep every master build (each one is a release), but drop superseded
  # builds on other branches.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # Every cmake run (including the ExternalProject sub-builds of protobuf, SDL,
  # GameNetworkingSockets...) compiles through ccache; its cache is kept
  # between runs by the ccache-action step of each job.
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  # Release that every job of this run uploads into
  RELEASE_TAG: build-${{ github.run_number }}
  IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

jobs:
  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    env:
      OPENJKDF2_BUILD_DIR: /tmp/OpenJKDF2/Linux/x86_64/Release
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}
          max-size: 2G
      - name: Install Packages
        run: |
          sudo apt-get update -qq &&
          sudo apt-get install -y build-essential cmake make clang python3 python3-pip bison imagemagick zsh \
                                  libgtk-3-dev libopenal-dev libglew-dev libssl-dev libprotobuf-dev libpng-dev libcurl4-openssl-dev \
                                  protobuf-compiler \
                                  libx11-dev libxext-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev \
                                  libxss-dev libxxf86vm-dev libxtst-dev libxfixes-dev libxkbcommon-dev \
                                  libwayland-dev wayland-protocols libasound2-dev libpulse-dev libdbus-1-dev libudev-dev &&
          sudo pip3 install cogapp
      - name: Generate CMake Build System
        run: |
          export OPENJKDF2_RELEASE_COMMIT="$(git log -1 --format=%H)" \
                 OPENJKDF2_RELEASE_COMMIT_SHORT="$(git rev-parse --short=8 HEAD)"
          cmake -DCMAKE_BUILD_TYPE=Release -B "$OPENJKDF2_BUILD_DIR"
      - name: Make
        run: make -C "$OPENJKDF2_BUILD_DIR" -j $(nproc)
      - name: Package
        run: |
          PKG=OpenJKDF2-linux-x86_64
          mkdir -p "$PKG"
          cp "$OPENJKDF2_BUILD_DIR/openjkdf2" "$PKG/"
          find "$OPENJKDF2_BUILD_DIR" -name 'libGameNetworkingSockets.so*' -exec cp -P {} "$PKG/" \;
          # Launcher: finds the bundled libs without changing the working
          # directory (the game uses it to locate an existing install).
          printf '%s\n' '#!/bin/sh' 'DIR="$(dirname "$(readlink -f "$0")")"' \
            'LD_LIBRARY_PATH="$DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "$DIR/openjkdf2" "$@"' > "$PKG/openjkdf2.sh"
          chmod +x "$PKG/openjkdf2.sh" "$PKG/openjkdf2"
          tar -czf "$PKG.tar.gz" "$PKG"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: OpenJKDF2-linux-x86_64.tar.gz
      - name: Add to release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Whichever job finishes first creates the release; a concurrent
          # create fails on the existing tag, which is fine.
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"                --title "$RELEASE_TAG (${GITHUB_SHA:0:8})" --generate-notes ||
            gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber OpenJKDF2-linux-x86_64.tar.gz

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}
          max-size: 2G
      - name: Install Packages
        run: |
          set -e
          brew unlink python3
          brew upgrade && brew install --overwrite python3
          brew install cmake make imagemagick
          pip3 install --break-system-packages cogapp generate-iconset
          brew install openal-soft glew libmodplug libpng
          brew install openssl@3 protobuf
      - name: Build
        run: export HOMEBREW_PREFIX="/usr/local" && ./.github/build_macos.sh
      - name: Package
        # The .app is not signed/notarized: macOS users must clear the
        # quarantine flag (xattr -cr OpenJKDF2.app) before the first launch.
        run: ditto -c -k --keepParent OpenJKDF2.app OpenJKDF2-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: OpenJKDF2-macos-arm64.zip
      - name: Add to release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Whichever job finishes first creates the release; a concurrent
          # create fails on the existing tag, which is fine.
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"                --title "$RELEASE_TAG (${GITHUB_SHA:0:8})" --generate-notes ||
            gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber OpenJKDF2-macos-arm64.zip

  win64:
    name: Windows x64
    runs-on: ubuntu-24.04
    env:
      OPENJKDF2_BUILD_DIR: build_win64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}
          max-size: 2G
      - name: Install Packages
        run: |
          sudo apt-get update -qq &&
          sudo apt-get install \
                       -y --no-install-suggests --no-install-recommends \
                       build-essential devscripts cmake make python3 python3-pip imagemagick zip &&
          sudo apt-get install -y zsh mingw-w64 clang libopenal-dev libglew-dev &&
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix &&
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix &&
          sudo pip3 install cogapp
      - name: Generate CMake Build System
        run: |
          export OPENJKDF2_RELEASE_COMMIT="$(git log -1 --format=%H)" \
                 OPENJKDF2_RELEASE_COMMIT_SHORT="$(git rev-parse --short=8 HEAD)"
          # Full build like distpkg_win64.sh (no GITHUB_RUNNER_COMPILE, which
          # drops OpenAL and networking): this zip is a release.
          cmake --toolchain cmake_modules/toolchain_mingw.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -B "$OPENJKDF2_BUILD_DIR"
      - name: Make
        run: |
          (make -C "$OPENJKDF2_BUILD_DIR" -j $(nproc) PROTOBUF || make -C "$OPENJKDF2_BUILD_DIR" -j1 PROTOBUF) &&
          (make -C "$OPENJKDF2_BUILD_DIR" -j $(nproc) PROTOC || make -C "$OPENJKDF2_BUILD_DIR" -j1 PROTOC) &&
          make -C "$OPENJKDF2_BUILD_DIR" -j $(nproc) openjkdf2-64
      - name: Package
        run: |
          ./scripts/helper_CopyMinGWDLLs.sh
          mkdir -p win64-package
          cp build_win64/*.dll build_win64/*.exe win64-package/
          # Fail if a non-system DLL the exe/DLLs import is not in the package
          # (DLL names are case-insensitive on Windows: compare in lowercase)
          missing=0
          packaged=$(ls win64-package | tr 'A-Z' 'a-z')
          for dll in $(x86_64-w64-mingw32-objdump -p win64-package/*.exe win64-package/*.dll | sed -n 's/^\s*DLL Name: //p' | tr 'A-Z' 'a-z' | sort -u); do
            if ! echo "$packaged" | grep -qxF "$dll" && [ ! -f "/usr/x86_64-w64-mingw32/lib/lib${dll%.dll}.a" ]; then
              echo "::error::$dll is imported but not packaged"; missing=1
            fi
          done
          ls -la win64-package
          [ "$missing" = 0 ]
          (cd win64-package && zip -r ../OpenJKDF2-win64.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: win64
          path: OpenJKDF2-win64.zip
      - name: Add to release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Whichever job finishes first creates the release; a concurrent
          # create fails on the existing tag, which is fine.
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"                --title "$RELEASE_TAG (${GITHUB_SHA:0:8})" --generate-notes ||
            gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber OpenJKDF2-win64.zip

  android:
    name: Android arm64
    runs-on: ubuntu-24.04
    env:
      OPENJKDF2_BUILD_DIR: build_android_aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch commit history
        # versionCode is the commit count: fetch the main repo's commits only
        # (no file contents, no submodule history)
        run: git fetch --unshallow --filter=tree:0 --no-recurse-submodules origin
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}
          max-size: 2G
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Packages
        run: |
          sudo apt-get update -qq &&
          sudo apt-get install -y --no-install-suggests --no-install-recommends \
                       build-essential cmake make python3 python3-pip bison imagemagick &&
          sudo pip3 install cogapp
      - name: Generate CMake Build System
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export OPENJKDF2_RELEASE_COMMIT="$(git log -1 --format=%H)" \
                 OPENJKDF2_RELEASE_COMMIT_SHORT="$(git rev-parse --short=8 HEAD)"
          cmake --toolchain cmake_modules/toolchain_android_aarch64.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -B "$OPENJKDF2_BUILD_DIR"
      - name: Make
        run: make -C "$OPENJKDF2_BUILD_DIR" -j $(nproc) openjkdf2-armv8a || make -C "$OPENJKDF2_BUILD_DIR" -j1 openjkdf2-armv8a
      - name: Gradle
        env:
          OPENJKDF2_KEYSTORE_B64: ${{ secrets.OPENJKDF2_KEYSTORE_B64 }}
          OPENJKDF2_KEYSTORE_PASSWORD: ${{ secrets.OPENJKDF2_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$OPENJKDF2_KEYSTORE_B64" ]; then
            export OPENJKDF2_KEYSTORE_FILE="$RUNNER_TEMP/openjkdf2-release.jks"
            echo "$OPENJKDF2_KEYSTORE_B64" | base64 -d > "$OPENJKDF2_KEYSTORE_FILE"
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::Secret OPENJKDF2_KEYSTORE_B64 is missing, refusing to release an APK signed with a throwaway key"
            exit 1
          else
            echo "::warning::No signing secret: this APK is signed with the runner's debug key and cannot update a release install"
          fi
          LIBS=packaging/android-project/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$LIBS"
          cp "$OPENJKDF2_BUILD_DIR/libopenjkdf2-armv8a.so" "$LIBS/libmain.so"
          cp "$(find "$OPENJKDF2_BUILD_DIR" -name libopenal.so | head -1)" "$LIBS/"
          cp "$(find "$OPENJKDF2_BUILD_DIR" -name libSDL3.so | head -1)" "$LIBS/"
          cp "$(find "$OPENJKDF2_BUILD_DIR" -name libSDL3_mixer.so | head -1)" "$LIBS/"
          cd packaging/android-project
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          # Two apps: OpenJKDF2 (org.openjkdf2.app) and OpenMoTS (org.openjkdf2.mots)
          cp app/build/outputs/apk/jk/debug/app-jk-debug.apk "$GITHUB_WORKSPACE/OpenJKDF2-android-arm64-v8a.apk"
          cp app/build/outputs/apk/mots/debug/app-mots-debug.apk "$GITHUB_WORKSPACE/OpenMoTS-android-arm64-v8a.apk"
          rm -f "$RUNNER_TEMP/openjkdf2-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            OpenJKDF2-android-arm64-v8a.apk
            OpenMoTS-android-arm64-v8a.apk
      - name: Add to release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Whichever job finishes first creates the release; a concurrent
          # create fails on the existing tag, which is fine.
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"                --title "$RELEASE_TAG (${GITHUB_SHA:0:8})" --generate-notes ||
            gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber OpenJKDF2-android-arm64-v8a.apk OpenMoTS-android-arm64-v8a.apk
