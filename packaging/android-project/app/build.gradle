def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

// Derive versioning from git: versionCode is the total commit count
// (monotonic, so every build counts as an update and launcher/package-info
// caches invalidate), versionName is "<latest tag>.<commit count>".
def gitCmd = { String... args ->
    try {
        def proc = args.execute(null, rootDir)
        def out = new StringBuilder()
        proc.consumeProcessOutput(out, null)
        proc.waitFor()
        return proc.exitValue() == 0 ? out.toString().trim() : null
    } catch (Exception ignored) {
        return null
    }
}
def gitCommitCount = (gitCmd("git", "rev-list", "--count", "HEAD") ?: "1").toInteger()
def gitLatestTag = gitCmd("git", "describe", "--tags", "--abbrev=0") ?: "untagged"

android {
    if (buildAsApplication) {
        namespace "org.openjkdf2.app"
    }
    compileSdkVersion 34
    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 34
        versionCode gitCommitCount
        versionName "${gitLatestTag}.${gitCommitCount}"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-19"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
            // cmake {
            //     arguments "-DANDROID_APP_PLATFORM=android-19", "-DANDROID_STL=c++_static"
            //     // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            //     abiFilters 'arm64-v8a'
            // }
        }
    }
    // One app per game, so launchers that show a single icon per package list
    // both: "jk" keeps the original package, "mots" is a separate app whose
    // launcher entry starts Mysteries of the Sith (see src/mots).
    flavorDimensions "game"
    productFlavors {
        jk {
            dimension "game"
            applicationId "org.openjkdf2.app"
        }
        mots {
            dimension "game"
            applicationId "org.openjkdf2.mots"
        }
    }

    // Fixed signing key so CI-built APKs (built on fresh runners) install
    // over each other. Provided by CI secrets via the environment; without
    // them, builds fall back to the default per-machine debug key.
    def releaseKeystore = System.getenv("OPENJKDF2_KEYSTORE_FILE")
    def hasReleaseKey = releaseKeystore && file(releaseKeystore).exists()
    signingConfigs {
        if (hasReleaseKey) {
            ci {
                storeFile file(releaseKeystore)
                storePassword System.getenv("OPENJKDF2_KEYSTORE_PASSWORD")
                keyAlias System.getenv("OPENJKDF2_KEY_ALIAS") ?: "openjkdf2"
                keyPassword System.getenv("OPENJKDF2_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            if (hasReleaseKey) {
                signingConfig signingConfigs.ci
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.ci
            }
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            //.dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            //ndkBuild {
            //    path 'jni/Android.mk'
            //}
            // cmake {
            //     path 'jni/CMakeLists.txt'
            // }
        }
       
    }
    lint {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.openjkdf2.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
